<!DOCTYPE html>
<html lang="mr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="item-title">वस्तू तपशील</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;600;700&family=Noto+Sans:wght@400;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header class="header">
        <div class="header-content">
            <div style="display: flex; align-items: center; gap: 1rem;">
                <a href="javascript:history.back()" class="back-btn"><i class="fas fa-arrow-left"></i></a>
                <img src="./assets/images/logo.png" alt="Logo" class="header-logo">
                <div class="shop-name" id="item-name">वस्तू</div>
            </div>
            <button class="lang-toggle" onclick="switchLanguage()"><i class="fas fa-language"></i> English</button>
        </div>
    </header>

    <div class="container">
        <div id="item-details"></div>
    </div>

    <script src="js/language.js"></script>
    <script src="js/app.js"></script>
    <script src="js/item-details.js"></script>
    <script>
        async function initApp() {
            await initLanguage();
            await loadItemDetails();
        }
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initApp);
        } else {
            initApp();
        }
    </script>
</body>

</html>
